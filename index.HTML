        langItBtn.classList.add('active');
        langItBtn.setAttribute('aria-pressed', 'true');
        langEnBtn.classList.remove('active');
        langEnBtn.setAttribute('aria-pressed', 'false');
      }
    }

    function updateTabButtons() {
      if (currentTab === 'resume') {
        tabResumeBtn.classList.add('active');
        tabResumeBtn.setAttribute('aria-pressed', 'true');
        tabCoverBtn.classList.remove('active');
        tabCoverBtn.setAttribute('aria-pressed', 'false');
      } else {
        tabCoverBtn.classList.add('active');
        tabCoverBtn.setAttribute('aria-pressed', 'true');
        tabResumeBtn.classList.remove('active');
        tabResumeBtn.setAttribute('aria-pressed', 'false');
      }
    }

    // Event listeners
    langEnBtn.addEventListener('click', () => {
      if (currentLang !== 'en') {
        currentLang = 'en';
        updateLangButtons();
        updateContent();
      }
    });

    langItBtn.addEventListener('click', () => {
      if (currentLang !== 'it') {
        currentLang = 'it';
        updateLangButtons();
        updateContent();
      }
    });

    tabResumeBtn.addEventListener('click', () => {
      if (currentTab !== 'resume') {
        currentTab = 'resume';
        updateTabButtons();
        updateContent();
      }
    });

    tabCoverBtn.addEventListener('click', () => {
      if (currentTab !== 'cover') {
        currentTab = 'cover';
        updateTabButtons();
        updateContent();
      }
    });

    // Initialize content
    updateLangButtons();
    updateTabButtons();
    updateContent();
  </script>
</body>
</html>
